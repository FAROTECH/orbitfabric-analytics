name: Collect GitHub traffic

on:
  schedule:
    # GitHub cron is UTC. 21:30 UTC is 23:30 in Italy during CEST.
    - cron: "30 21 * * *"
  workflow_dispatch:

concurrency:
  group: collect-github-traffic
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Build repository matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Check out analytics configuration
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install configuration dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify collector token
        env:
          GHRS_TOKEN: ${{ secrets.GHRS_GITHUB_API_TOKEN }}
        run: |
          if [ -z "$GHRS_TOKEN" ]; then
            echo "::error::Repository secret GHRS_GITHUB_API_TOKEN is not configured."
            exit 1
          fi

      - name: Build collection matrix
        id: matrix
        run: |
          MATRIX="$(python tools/build_repository_matrix.py config/repositories.yml)"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Repositories selected for collection:"
          python -c 'import json,sys; [print(" - " + item["repository"]) for item in json.loads(sys.argv[1])]' "$MATRIX"

  collect:
    name: Collect ${{ matrix.target.repository }}
    needs: prepare
    if: ${{ needs.prepare.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Collect repository traffic and generate report
        uses: jgehrcke/github-repo-stats@v1.4.2
        with:
          repository: ${{ matrix.target.repository }}
          ghtoken: ${{ secrets.GHRS_GITHUB_API_TOKEN }}
          databranch: github-repo-stats

  aggregate:
    name: Build ecosystem analytics datasets
    needs:
      - prepare
      - collect
    runs-on: ubuntu-latest

    steps:
      - name: Check out analytics code
        uses: actions/checkout@v4
        with:
          path: app

      - name: Check out collected data
        uses: actions/checkout@v4
        with:
          ref: github-repo-stats
          path: data
          token: ${{ secrets.GHRS_GITHUB_API_TOKEN }}

      - name: Check out dashboard deployment branch
        uses: actions/checkout@v4
        with:
          ref: dashboard-site
          path: site
          token: ${{ secrets.GHRS_GITHUB_API_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analytics dependencies
        run: python -m pip install --disable-pip-version-check -r app/requirements.txt

      - name: Run analytics tests
        working-directory: app
        run: python -m unittest discover -s tests -v

      - name: Build normalized event registry
        run: |
          python app/analytics/events.py \
            --events app/config/events.yml \
            --taxonomy app/config/event-taxonomy.yml \
            --repositories app/config/repositories.yml \
            --output data/analytics/events_normalized.json

      - name: Build normalized repository-day dataset
        run: |
          python app/analytics/aggregate.py \
            --config app/config/repositories.yml \
            --data-root data \
            --output data/analytics/ecosystem_daily.csv

      - name: Build official cross-repository rollups
        run: |
          python app/analytics/rollup.py \
            --config app/config/repositories.yml \
            --input data/analytics/ecosystem_daily.csv \
            --output data/analytics/ecosystem_rollups_daily.csv

      - name: Build recent repository comparison snapshot
        run: |
          python app/analytics/compare.py \
            --config app/config/repositories.yml \
            --input data/analytics/ecosystem_daily.csv \
            --rollups data/analytics/ecosystem_rollups_daily.csv \
            --days 14 \
            --output data/analytics/repository_comparison_latest.csv

      - name: Build static dashboard payload
        run: |
          python app/analytics/dashboard_data.py \
            --rollups data/analytics/ecosystem_rollups_daily.csv \
            --comparison data/analytics/repository_comparison_latest.csv \
            --daily data/analytics/ecosystem_daily.csv \
            --output data/analytics/dashboard_data.json

      - name: Project events into dashboard payload
        run: |
          python app/analytics/dashboard_events.py \
            --dashboard data/analytics/dashboard_data.json \
            --events data/analytics/events_normalized.json

      - name: Persist analytics datasets
        working-directory: data
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add \
            analytics/events_normalized.json \
            analytics/ecosystem_daily.csv \
            analytics/ecosystem_rollups_daily.csv \
            analytics/repository_comparison_latest.csv \
            analytics/dashboard_data.json

          if git diff --cached --quiet; then
            echo "Analytics datasets unchanged."
          else
            git commit -m "analytics: refresh ecosystem datasets"
            git push origin HEAD:github-repo-stats
          fi

      - name: Assemble static dashboard site
        run: |
          rsync -a --delete app/dashboard/ site/dashboard/
          mkdir -p site/dashboard/data
          cp data/analytics/dashboard_data.json site/dashboard/data/dashboard_data.json

      - name: Persist static dashboard site
        working-directory: site
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -A dashboard
          git add -f dashboard/data/dashboard_data.json

          if git diff --cached --quiet; then
            echo "Static dashboard site unchanged."
            exit 0
          fi

          git commit -m "dashboard: refresh static site"
          git push origin HEAD:dashboard-site
